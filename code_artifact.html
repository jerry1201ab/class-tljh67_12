<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班級數位聯絡簿</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans TC"', 'Inter', 'sans-serif'],
          },
          colors: {
            board: {
              bg: '#f1f5f9',
              card: '#ffffff',
              border: '#e2e8f0',
            },
            theme: {
              black: '#0f172a',
              red: '#dc2626',
              redLight: '#fef2f2',
              redBorder: '#f87171',
              yellow: '#b45309',
              yellowBg: '#fefce8',
              yellowBorder: '#facc15'
            }
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --ui-scale: 1;
    }
    
    body {
      font-size: calc(1rem * var(--ui-scale));
      touch-action: manipulation;
    }

    /* 條目微陰影與互動 */
    .entry-card {
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .entry-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.06);
    }

    /* 滾動條美化 */
    .custom-scrollbar::-webkit-scrollbar {
      width: 7px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* 編輯模式提示標示 */
    .editable-glow {
      outline: 2px dashed #64748b;
      outline-offset: 4px;
      border-radius: 6px;
      cursor: text;
    }
    .editable-glow:hover {
      outline-color: #2563eb;
      background-color: rgba(37, 99, 235, 0.05);
    }
  </style>
</head>
<body class="bg-board-bg text-theme-black antialiased min-h-screen flex flex-col select-none">

  <!-- 頂部資訊與控制工具列 -->
  <header class="bg-white border-b-2 border-board-border px-4 py-3 sm:px-8 shadow-xs flex flex-wrap justify-between items-center gap-3">
    <div class="flex items-center gap-4 flex-wrap">
      <div id="classTitleDisplay" class="text-2xl sm:text-3xl font-black text-theme-black tracking-tight" title="班級名稱">
        712 班級聯絡簿
      </div>
      <div class="h-6 w-0.5 bg-slate-300 hidden sm:block"></div>
      
      <!-- 歷史日期切換與日曆選擇器 -->
      <div class="flex items-center gap-1.5 bg-slate-100 p-1 rounded-xl border border-slate-200">
        <button onclick="changeDateOffset(-1)" class="p-1 sm:px-2 rounded-lg text-slate-600 hover:bg-white hover:text-slate-900 font-bold transition text-sm" title="前一天">◀</button>
        <div class="relative flex items-center">
          <input type="date" id="datePickerInput" onchange="onDatePickChange(event)" class="opacity-0 absolute inset-0 w-full h-full cursor-pointer">
          <span id="dateDisplay" class="text-sm sm:text-base font-bold text-slate-800 px-2 cursor-pointer select-none hover:text-blue-600 transition flex items-center gap-1" title="點擊選擇特定日期">
            載入中... 📅
          </span>
        </div>
        <button onclick="changeDateOffset(1)" class="p-1 sm:px-2 rounded-lg text-slate-600 hover:bg-white hover:text-slate-900 font-bold transition text-sm" title="後一天">▶</button>
        <button onclick="goToToday()" id="todayQuickBtn" class="hidden text-xs bg-slate-800 text-white font-bold px-2 py-1 rounded-md hover:bg-slate-700 transition ml-1">回今天</button>
      </div>
    </div>

    <!-- 功能快捷列 -->
    <div class="flex items-center gap-2 flex-wrap">
      <!-- 字級縮放 (A- / A+) -->
      <div class="inline-flex rounded-lg border border-slate-300 bg-slate-50 p-0.5 shadow-xs">
        <button onclick="adjustScale(-0.1)" class="px-3 py-1.5 text-sm font-black text-slate-700 hover:bg-white rounded-md transition" title="縮小全域字體">A-</button>
        <span class="px-2 py-1 text-xs font-bold text-slate-500 self-center" id="scaleIndicator">100%</span>
        <button onclick="adjustScale(0.1)" class="px-3 py-1.5 text-sm font-black text-slate-700 hover:bg-white rounded-md transition" title="放大全域字體">A+</button>
      </div>

      <!-- 全螢幕切換 -->
      <button onclick="toggleFullScreen()" class="px-3.5 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 font-bold text-sm text-slate-700 flex items-center gap-1.5 shadow-xs transition" title="全螢幕展示">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
        <span class="hidden md:inline">全螢幕</span>
      </button>

      <!-- 模式切換按鈕區 -->
      <div id="authArea">
        <button onclick="openModal('loginModal')" id="lockBtn" class="px-4 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm flex items-center gap-1.5 shadow-sm transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
          <span>🔒 進入編輯</span>
        </button>

        <div id="editModeToolbar" class="hidden flex items-center gap-2">
          <!-- 當前編輯者顯示徽章 -->
          <div class="px-3 py-1 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-black flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>編輯者：<span id="currentEditorName">教師</span></span>
          </div>

          <button onclick="openModal('settingsModal')" class="px-3.5 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 font-bold text-sm text-slate-700 flex items-center gap-1.5 shadow-xs transition">
            ⚙️ 設定
          </button>
          <button onclick="exitEditMode()" class="px-4 py-1.5 rounded-lg bg-red-600 hover:bg-red-700 text-white font-bold text-sm flex items-center gap-1.5 shadow-sm transition">
            🔓 鎖定離開
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- 主要條目看板區塊 -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6 flex flex-col gap-4">
    <!-- 歷史模式瀏覽提醒標籤 -->
    <div id="historyWarningBanner" class="hidden bg-amber-50 border border-amber-200 rounded-xl px-4 py-2 text-amber-800 text-xs sm:text-sm font-bold flex items-center justify-between">
      <span class="flex items-center gap-1.5">
        <span>🕒</span> 您正在瀏覽過去的歷史聯絡簿（唯讀模式）。
      </span>
      <button onclick="goToToday()" class="underline text-amber-900 hover:text-amber-700 font-black">返回今天</button>
    </div>

    <!-- 面板功能條 -->
    <div class="flex items-center justify-between gap-3 bg-white px-4 py-3 rounded-2xl border border-board-border shadow-xs">
      <div class="flex items-center gap-2">
        <span class="text-lg sm:text-xl font-black text-slate-800">📌 今日作業與交代事項</span>
        <span id="entryCountBadge" class="text-xs px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600 font-bold">0 條</span>
      </div>
      <div class="flex items-center gap-2">
        <!-- 序號開關按鈕 -->
        <button onclick="toggleIndexNumber()" id="indexToggleBtn" class="px-3 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 font-bold text-xs sm:text-sm text-slate-700 transition">
          123 序號：開
        </button>
      </div>
    </div>

    <!-- 新增條目面板（僅在編輯模式下顯示） -->
    <div id="entryAddBox" class="hidden bg-white p-4 rounded-2xl border-2 border-dashed border-slate-300 flex flex-col sm:flex-row gap-2 shadow-xs">
      <select id="entryTagInput" class="px-3 py-2 rounded-xl border border-slate-300 bg-slate-50 text-sm font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-800">
        <option value="作業">作業</option>
        <option value="考試">考試</option>
        <option value="通知">通知</option>
        <option value="攜帶">攜帶</option>
        <option value="常規">常規</option>
      </select>
      <select id="entryColorInput" class="px-3 py-2 rounded-xl border border-slate-300 bg-slate-50 text-sm font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-800">
        <option value="black">黑色（一般事項）</option>
        <option value="red">紅色（重大重點）</option>
        <option value="yellow">黃色（提醒叮嚀）</option>
      </select>
      <input type="text" id="entryTextInput" placeholder="輸入作業或交代事項內容..." class="flex-1 px-4 py-2 rounded-xl border border-slate-300 text-base font-bold focus:outline-none focus:ring-2 focus:ring-slate-800" onkeydown="if(event.key==='Enter') addNewEntry()">
      <button onclick="addNewEntry()" class="px-5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm shadow-sm transition whitespace-nowrap">
        ＋ 新增條目
      </button>
    </div>

    <!-- 條目清單容器 -->
    <ul id="entryList" class="flex flex-col gap-3"></ul>

    <!-- 空白提示 -->
    <div id="entryEmptyMsg" class="hidden py-16 text-center text-slate-400 font-bold">
      <div class="text-4xl mb-2">📋</div>
      <p class="text-lg">目前尚無今日聯絡簿事項</p>
    </div>
  </main>

  <!-- 密碼登入 Modal (支援下拉選擇使用者或輸入) -->
  <div id="loginModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-200 flex flex-col gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-xl">🔒</div>
        <div>
          <h3 class="text-lg font-black text-slate-900">身分登入</h3>
          <p class="text-xs text-slate-500">請選擇身分並輸入密碼以解鎖編輯</p>
        </div>
      </div>

      <div class="flex flex-col gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">編輯使用者：</label>
          <select id="loginUserSelect" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-white text-sm font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-900">
            <!-- 動態填入使用者清單 -->
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">密碼：</label>
          <input type="password" id="passwordInput" placeholder="請輸入密碼" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-slate-900 text-base tracking-widest text-center font-bold" onkeydown="if(event.key==='Enter') submitLogin()">
        </div>
      </div>

      <div id="pwdErrorMsg" class="text-xs text-red-600 font-bold text-center hidden">密碼錯誤，請重新輸入！</div>
      <div class="flex gap-2 justify-end pt-1">
        <button onclick="closeModal('loginModal')" class="px-4 py-2 rounded-xl border border-slate-300 text-sm font-bold text-slate-700 hover:bg-slate-50">取消</button>
        <button onclick="submitLogin()" class="px-5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-sm font-bold text-white shadow-sm">解鎖登入</button>
      </div>
    </div>
  </div>

  <!-- 系統設定 Modal (包含使用者管理分頁) -->
  <div id="settingsModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 flex flex-col gap-5 max-h-[90vh] overflow-hidden">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="text-lg font-black text-slate-900 flex items-center gap-2">
          <span>⚙️</span> 系統與使用者管理
        </h3>
        <button onclick="closeModal('settingsModal')" class="text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>
      </div>

      <div class="overflow-y-auto flex-1 flex flex-col gap-5 pr-1 custom-scrollbar">
        <!-- 👥 編輯使用者管理專區 -->
        <div class="flex flex-col gap-3">
          <div class="flex items-center justify-between">
            <label class="text-sm font-black text-slate-800 flex items-center gap-1.5">
              <span>👥</span> 編輯權限名單（幹部／老師）
            </label>
            <span class="text-xs text-slate-500 font-semibold">登入後即可編輯條目</span>
          </div>

          <!-- 使用者列表 -->
          <div class="border border-slate-200 rounded-xl overflow-hidden bg-slate-50">
            <ul id="userList" class="divide-y divide-slate-200 max-h-40 overflow-y-auto custom-scrollbar">
              <!-- 動態產出使用者清單 -->
            </ul>
          </div>

          <!-- ➕ 新增編輯使用者面板 -->
          <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 flex flex-col gap-2">
            <span class="text-xs font-black text-slate-700">＋ 新增編輯使用者：</span>
            <div class="flex flex-wrap gap-2">
              <input type="text" id="newUserNameInput" placeholder="身分/姓名（例：聯絡簿股長）" class="flex-1 min-w-[140px] px-3 py-1.5 rounded-lg border border-slate-300 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-slate-800">
              <input type="password" id="newUserPwdInput" placeholder="專屬密碼" class="w-28 px-3 py-1.5 rounded-lg border border-slate-300 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-slate-800">
              <button onclick="addUser()" class="px-3.5 py-1.5 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-xs font-bold shadow-xs whitespace-nowrap">
                新增使用者
              </button>
            </div>
          </div>
        </div>

        <!-- 密碼修改區（當前使用者修改自己的密碼） -->
        <div class="flex flex-col gap-2 pt-3 border-t">
          <label class="text-sm font-bold text-slate-700">修改當前登入者（<span id="currentChangeUserLabel">教師</span>）密碼：</label>
          <div class="flex gap-2">
            <input type="password" id="newPasswordInput" placeholder="輸入新密碼" class="flex-1 px-3.5 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-slate-800 font-semibold">
            <button onclick="changeCurrentPassword()" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-900 text-white font-bold text-sm">更新密碼</button>
          </div>
        </div>

        <!-- 資料備份與還原 -->
        <div class="flex flex-col gap-2 pt-3 border-t">
          <label class="text-sm font-bold text-slate-700">資料備份與還原（包含帳號與條目）：</label>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="exportData()" class="px-3 py-2 rounded-xl border border-slate-300 hover:bg-slate-50 font-bold text-sm text-slate-700 flex items-center justify-center gap-1.5">
              💾 匯出備份 (JSON)
            </button>
            <button onclick="document.getElementById('importFile').click()" class="px-3 py-2 rounded-xl border border-slate-300 hover:bg-slate-50 font-bold text-sm text-slate-700 flex items-center justify-center gap-1.5">
              📥 匯入備份 (JSON)
            </button>
            <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
          </div>
        </div>

        <!-- 危險動作：一鍵清空 -->
        <div class="pt-3 border-t">
          <button onclick="requestClearAll()" class="w-full py-2.5 rounded-xl bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 font-bold text-sm transition flex items-center justify-center gap-1.5">
            🗑️ 清空今日所有聯絡簿條目
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 自訂確認對話方塊 -->
  <div id="confirmModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-200 flex flex-col gap-4">
      <h3 id="confirmTitle" class="text-lg font-black text-slate-900">確認清除</h3>
      <p id="confirmMsg" class="text-sm font-medium text-slate-600">確定要清空今日所有事項嗎？此操作無法撤回。</p>
      <div class="flex gap-2 justify-end pt-2">
        <button id="confirmCancelBtn" class="px-4 py-2 rounded-xl border border-slate-300 text-sm font-bold text-slate-700 hover:bg-slate-50">取消</button>
        <button id="confirmOkBtn" class="px-5 py-2 rounded-xl bg-red-600 hover:bg-red-700 text-sm font-bold text-white shadow-sm">確認清空</button>
      </div>
    </div>
  </div>

  <!-- 浮動訊息 Toast -->
  <div id="toastBox" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script>
    /* ========================================================
       狀態管理與預設資料
       ======================================================== */
    const STORAGE_KEY = 'classroom_pure_notebook_data';
    
    // 取得指定日期的標準鍵值 YYYY-MM-DD
    function formatDateKey(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    const todayDateKey = formatDateKey(new Date());
    let currentDateKey = todayDateKey; // 當前瀏覽中的日期

    const DEFAULT_DATA = {
      users: [
        { id: 'admin', name: '教師 / 管理員', password: '1234', isAdmin: true },
        { id: 'student_1', name: '聯絡簿股長', password: '71207', isAdmin: false }
      ],
      classTitle: '712 班級聯絡簿',
      showIndex: true,
      fontScale: 1.0,
      // 每日獨立歷史紀錄，格式： { "YYYY-MM-DD": [ {id, tag, text, color}, ... ] }
      dailyHistory: {
        [todayDateKey]: [
          { id: '1', tag: '作業', text: '國文習作 P.24 - P.26，明天早上第一節收齊。', color: 'black' },
          { id: '2', tag: '考試', text: '明天第一節考數學第三單元（整數與分數四則運算）。', color: 'red' },
          { id: '3', tag: '攜帶', text: '綜合課帶童軍繩、資訊科技課自備 3.5mm 耳機。', color: 'yellow' },
          { id: '4', tag: '常規', text: '放學前各排確實將椅子靠好、窗戶反鎖。', color: 'black' }
        ]
      }
    };

    let appData = {};
    let isEditMode = false;
    let currentUser = null;

    // 初始化狀態
    function initData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          appData = Object.assign({}, DEFAULT_DATA, parsed);

          // 向下相容升級：若先前版本使用單一 entries 陣列，自動移轉為 dailyHistory
          if (parsed.entries && !parsed.dailyHistory) {
            appData.dailyHistory = {
              [todayDateKey]: parsed.entries
            };
            delete appData.entries;
          }
          if (!appData.dailyHistory) {
            appData.dailyHistory = {};
          }
          if (!appData.dailyHistory[todayDateKey]) {
            appData.dailyHistory[todayDateKey] = [];
          }

          // 幹部名稱與密碼升級相容
          if (!appData.users || !Array.isArray(appData.users) || appData.users.length === 0) {
            appData.users = [
              { id: 'admin', name: '教師 / 管理員', password: parsed.password || '1234', isAdmin: true },
              { id: 'student_1', name: '聯絡簿股長', password: '71207', isAdmin: false }
            ];
          } else {
            const studentUser = appData.users.find(u => u.name === '學藝股長' || u.id === 'student_1');
            if (studentUser) {
              studentUser.name = '聯絡簿股長';
              studentUser.password = '71207';
            }
          }
        } catch (e) {
          appData = Object.assign({}, DEFAULT_DATA);
        }
      } else {
        appData = Object.assign({}, DEFAULT_DATA);
      }
      applyDataToDOM();
    }

    function persistData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    }

    /* 取得當前瀏覽日期的條目清單 */
    function getCurrentDayEntries() {
      if (!appData.dailyHistory[currentDateKey]) {
        appData.dailyHistory[currentDateKey] = [];
      }
      return appData.dailyHistory[currentDateKey];
    }

    /* ========================================================
       日期與時間顯示 / 歷史回溯控制
       ======================================================== */
    function updateDateDisplay() {
      const dateEl = document.getElementById('dateDisplay');
      const datePicker = document.getElementById('datePickerInput');
      const todayBtn = document.getElementById('todayQuickBtn');
      const warningBanner = document.getElementById('historyWarningBanner');

      const [y, m, d] = currentDateKey.split('-').map(Number);
      const targetDate = new Date(y, m - 1, d);
      const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
      const w = weekdays[targetDate.getDay()];

      dateEl.innerHTML = `${y} 年 ${String(m).padStart(2, '0')} 月 ${String(d).padStart(2, '0')} 日 星期${w} <span class="text-xs text-slate-400">📅</span>`;
      datePicker.value = currentDateKey;

      const isToday = (currentDateKey === todayDateKey);
      if (isToday) {
        todayBtn.classList.add('hidden');
        warningBanner.classList.add('hidden');
      } else {
        todayBtn.classList.remove('hidden');
        warningBanner.classList.remove('hidden');
      }
    }

    function changeDateOffset(offset) {
      const [y, m, d] = currentDateKey.split('-').map(Number);
      const targetDate = new Date(y, m - 1, d);
      targetDate.setDate(targetDate.getDate() + offset);
      currentDateKey = formatDateKey(targetDate);
      applyDataToDOM();
    }

    function onDatePickChange(event) {
      if (event.target.value) {
        currentDateKey = event.target.value;
        applyDataToDOM();
      }
    }

    function goToToday() {
      currentDateKey = todayDateKey;
      applyDataToDOM();
      showToast('已切換回今天的聯絡簿', 'info');
    }

    /* ========================================================
       畫面渲染核心
       ======================================================== */
    function applyDataToDOM() {
      updateDateDisplay();

      // 標題
      document.getElementById('classTitleDisplay').textContent = appData.classTitle;

      // 字級大小
      document.documentElement.style.setProperty('--ui-scale', appData.fontScale);
      document.getElementById('scaleIndicator').textContent = `${Math.round(appData.fontScale * 100)}%`;

      // 序號按鈕狀態
      const indexBtn = document.getElementById('indexToggleBtn');
      indexBtn.textContent = appData.showIndex ? '123 序號：開' : '123 序號：關';
      if (appData.showIndex) {
        indexBtn.classList.replace('bg-white', 'bg-slate-200');
      } else {
        indexBtn.classList.replace('bg-slate-200', 'bg-white');
      }

      // 渲染條目
      renderEntries();
      updateAuthUI();
    }

    /* 條目色彩樣式 (黑、紅、黃規範) */
    function getEntryThemeClasses(color) {
      switch(color) {
        case 'red':
          return {
            border: 'border-l-6 border-l-theme-red border-theme-redBorder bg-theme-redLight',
            tag: 'bg-theme-red text-white',
            text: 'text-theme-red font-bold',
            badge: '重大'
          };
        case 'yellow':
          return {
            border: 'border-l-6 border-l-theme-yellow border-theme-yellowBorder bg-theme-yellowBg',
            tag: 'bg-theme-yellow text-white',
            text: 'text-theme-yellow font-extrabold',
            badge: '提醒'
          };
        case 'black':
        default:
          return {
            border: 'border-l-6 border-l-theme-black border-slate-200 bg-white',
            tag: 'bg-theme-black text-white',
            text: 'text-theme-black font-semibold',
            badge: '一般'
          };
      }
    }

    function renderEntries() {
      const list = document.getElementById('entryList');
      const emptyMsg = document.getElementById('entryEmptyMsg');
      const countBadge = document.getElementById('entryCountBadge');
      list.innerHTML = '';

      const currentEntries = getCurrentDayEntries();
      countBadge.textContent = `${currentEntries.length} 條`;

      if (currentEntries.length === 0) {
        emptyMsg.classList.remove('hidden');
        return;
      }
      emptyMsg.classList.add('hidden');

      // 定義標籤分組的展示順序
      const tagOrder = ['作業', '考試', '通知', '攜帶', '常規'];
      
      // 將當天條目依標籤類型進行分組
      const grouped = {};
      currentEntries.forEach(item => {
        const tag = item.tag || '常規';
        if (!grouped[tag]) grouped[tag] = [];
        grouped[tag].push(item);
      });

      const sortedTags = Object.keys(grouped).sort((a, b) => {
        const idxA = tagOrder.indexOf(a);
        const idxB = tagOrder.indexOf(b);
        if (idxA !== -1 && idxB !== -1) return idxA - idxB;
        if (idxA !== -1) return -1;
        if (idxB !== -1) return 1;
        return a.localeCompare(b);
      });

      let itemCounter = 1;

      sortedTags.forEach(tag => {
        const items = grouped[tag];
        if (!items || items.length === 0) return;

        // 分組群組外框
        const groupContainer = document.createElement('div');
        groupContainer.className = 'flex flex-col gap-2.5 bg-slate-50/70 p-3 sm:p-4 rounded-2xl border border-slate-200/80';

        // 類型標題列
        const groupHeader = document.createElement('div');
        groupHeader.className = 'flex items-center gap-2 px-1 select-none';
        groupHeader.innerHTML = `
          <span class="w-2.5 h-2.5 rounded-full bg-slate-700"></span>
          <span class="text-sm sm:text-base font-black text-slate-800 tracking-wide">${escapeHtml(tag)}類事項</span>
          <span class="text-xs px-2 py-0.5 rounded-md bg-white border border-slate-200 text-slate-500 font-bold">${items.length} 項</span>
        `;
        groupContainer.appendChild(groupHeader);

        // 分組內的條目列表
        const subList = document.createElement('ul');
        subList.className = 'flex flex-col gap-2.5';

        items.forEach(item => {
          const theme = getEntryThemeClasses(item.color);
          const li = document.createElement('li');
          li.className = `entry-card p-3.5 sm:p-4 rounded-xl border shadow-2xs flex items-start justify-between gap-3 transition ${theme.border}`;

          const indexPart = appData.showIndex ? `<span class="font-black text-base sm:text-xl min-w-[28px] text-slate-800 self-start mt-0.5">${itemCounter}.</span>` : '';
          itemCounter++;

          let actionButtons = '';
          // 僅在編輯模式下顯示刪除按鈕
          if (isEditMode) {
            actionButtons = `
              <div class="flex items-center gap-1 select-none">
                <button onclick="deleteEntry('${item.id}')" class="p-1.5 rounded-lg text-slate-400 hover:text-red-600 hover:bg-red-50 transition" title="刪除此條目">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                </button>
              </div>
            `;
          }

          li.innerHTML = `
            <div class="flex items-start gap-3 flex-1 min-w-0">
              ${indexPart}
              <span class="text-xs sm:text-sm px-2.5 py-1 rounded-md font-black whitespace-nowrap self-start mt-0.5 shadow-2xs ${theme.tag}">${escapeHtml(item.tag)}</span>
              <div class="text-base sm:text-xl leading-relaxed break-words flex-1 ${theme.text}">${escapeHtml(item.text)}</div>
            </div>
            ${actionButtons}
          `;
          subList.appendChild(li);
        });

        groupContainer.appendChild(subList);
        list.appendChild(groupContainer);
      });
    }

    /* ========================================================
       條目操作（鎖定於當前檢視日期）
       ======================================================== */
    function addNewEntry() {
      const input = document.getElementById('entryTextInput');
      const tag = document.getElementById('entryTagInput').value;
      const color = document.getElementById('entryColorInput').value;
      const text = input.value.trim();

      if (!text) {
        showToast('請輸入聯絡事項內容！', 'warning');
        return;
      }

      if (!appData.dailyHistory[currentDateKey]) {
        appData.dailyHistory[currentDateKey] = [];
      }

      appData.dailyHistory[currentDateKey].push({
        id: Date.now().toString(),
        tag,
        text,
        color
      });

      input.value = '';
      persistData();
      renderEntries();
      showToast(`已新增至 ${currentDateKey} 的聯絡簿`, 'success');
    }

    function deleteEntry(id) {
      if (appData.dailyHistory[currentDateKey]) {
        appData.dailyHistory[currentDateKey] = appData.dailyHistory[currentDateKey].filter(e => e.id !== id);
        persistData();
        renderEntries();
        showToast('條目已刪除', 'info');
      }
    }

    function toggleIndexNumber() {
      appData.showIndex = !appData.showIndex;
      persistData();
      applyDataToDOM();
    }

    /* ========================================================
       權限與模式控制 (檢視 vs 編輯)
       ======================================================== */
    function updateAuthUI() {
      const lockBtn = document.getElementById('lockBtn');
      const editToolbar = document.getElementById('editModeToolbar');
      const entryAddBox = document.getElementById('entryAddBox');
      const classTitle = document.getElementById('classTitleDisplay');
      const editorNameDisplay = document.getElementById('currentEditorName');
      const changeUserLabel = document.getElementById('currentChangeUserLabel');

      if (isEditMode && currentUser) {
        lockBtn.classList.add('hidden');
        editToolbar.classList.remove('hidden');
        entryAddBox.classList.remove('hidden');

        editorNameDisplay.textContent = currentUser.name;
        changeUserLabel.textContent = currentUser.name;

        classTitle.classList.add('editable-glow');
        classTitle.onclick = promptEditClassTitle;
      } else {
        lockBtn.classList.remove('hidden');
        editToolbar.classList.add('hidden');
        entryAddBox.classList.add('hidden');

        classTitle.classList.remove('editable-glow');
        classTitle.onclick = null;
      }

      // 更新登入選單與使用者管理清單
      populateLoginUserSelect();
      renderUserList();
    }

    /* 填充登入視窗的使用者下拉選單 */
    function populateLoginUserSelect() {
      const select = document.getElementById('loginUserSelect');
      select.innerHTML = '';
      appData.users.forEach(u => {
        const opt = document.createElement('option');
        opt.value = u.id;
        opt.textContent = `${u.name}${u.isAdmin ? ' (管理員)' : ''}`;
        select.appendChild(opt);
      });
    }

    /* 登入驗證 */
    function submitLogin() {
      const selectedUserId = document.getElementById('loginUserSelect').value;
      const pwd = document.getElementById('passwordInput').value;
      const err = document.getElementById('pwdErrorMsg');

      const user = appData.users.find(u => u.id === selectedUserId);
      if (user && user.password === pwd) {
        currentUser = user;
        isEditMode = true;
        closeModal('loginModal');
        document.getElementById('passwordInput').value = '';
        err.classList.add('hidden');
        applyDataToDOM();
        showToast(`歡迎 ${currentUser.name}，已進入編輯模式`, 'success');
      } else {
        err.classList.remove('hidden');
      }
    }

    function exitEditMode() {
      isEditMode = false;
      currentUser = null;
      applyDataToDOM();
      showToast('已鎖定並返回純淨檢視模式', 'info');
    }

    /* ========================================================
       使用者帳號管理邏輯
       ======================================================== */
    function renderUserList() {
      const list = document.getElementById('userList');
      if (!list) return;
      list.innerHTML = '';

      appData.users.forEach(u => {
        const li = document.createElement('li');
        li.className = 'px-3 py-2 flex items-center justify-between text-xs font-semibold';

        const roleBadge = u.isAdmin 
          ? `<span class="px-2 py-0.5 rounded bg-blue-100 text-blue-700 font-bold">管理員</span>` 
          : `<span class="px-2 py-0.5 rounded bg-slate-200 text-slate-700">幹部 / 學生</span>`;

        let deleteBtn = '';
        // 防呆：不能刪除管理員帳號
        if (!u.isAdmin) {
          deleteBtn = `
            <button onclick="deleteUser('${u.id}')" class="text-red-500 hover:text-red-700 font-bold px-2 py-0.5 rounded hover:bg-red-50 transition" title="刪除此使用者">
              刪除
            </button>
          `;
        }

        li.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="font-bold text-slate-800 text-sm">${escapeHtml(u.name)}</span>
            ${roleBadge}
          </div>
          ${deleteBtn}
        `;
        list.appendChild(li);
      });
    }

    function addUser() {
      const nameInput = document.getElementById('newUserNameInput');
      const pwdInput = document.getElementById('newUserPwdInput');
      const name = nameInput.value.trim();
      const pwd = pwdInput.value.trim();

      if (!name) {
        showToast('請輸入使用者身分或姓名！', 'warning');
        return;
      }
      if (!pwd) {
        showToast('請為該使用者設定密碼！', 'warning');
        return;
      }

      // 檢查是否同名
      if (appData.users.some(u => u.name === name)) {
        showToast('已有同名的使用者，請使用不同名稱！', 'warning');
        return;
      }

      appData.users.push({
        id: 'user_' + Date.now(),
        name: name,
        password: pwd,
        isAdmin: false
      });

      nameInput.value = '';
      pwdInput.value = '';
      persistData();
      renderUserList();
      populateLoginUserSelect();
      showToast(`已新增編輯使用者：${name}`, 'success');
    }

    function deleteUser(userId) {
      const targetUser = appData.users.find(u => u.id === userId);
      if (!targetUser) return;

      if (targetUser.isAdmin) {
        showToast('不可刪除管理員帳號！', 'warning');
        return;
      }

      openConfirmModal(
        '刪除使用者',
        `確定要刪除「${targetUser.name}」的編輯權限嗎？`,
        () => {
          appData.users = appData.users.filter(u => u.id !== userId);
          persistData();
          renderUserList();
          populateLoginUserSelect();
          showToast(`已刪除使用者：${targetUser.name}`, 'info');
        }
      );
    }

    function changeCurrentPassword() {
      if (!currentUser) return;
      const newP = document.getElementById('newPasswordInput').value.trim();
      if (!newP) {
        showToast('新密碼不可為空！', 'warning');
        return;
      }

      // 更新該使用者的密碼
      const userObj = appData.users.find(u => u.id === currentUser.id);
      if (userObj) {
        userObj.password = newP;
        currentUser.password = newP;
        persistData();
        document.getElementById('newPasswordInput').value = '';
        showToast(`已成功修改 ${userObj.name} 的登入密碼！`, 'success');
      }
    }

    function promptEditClassTitle() {
      if (!isEditMode) return;
      const val = prompt('請輸入新的班級名稱：', appData.classTitle);
      if (val !== null && val.trim() !== '') {
        appData.classTitle = val.trim();
        persistData();
        applyDataToDOM();
        showToast('班級名稱已變更', 'success');
      }
    }

    /* ========================================================
       教室大螢幕專屬：字級縮放、全螢幕
       ======================================================== */
    function adjustScale(delta) {
      appData.fontScale = Math.min(1.8, Math.max(0.75, Math.round((appData.fontScale + delta) * 10) / 10));
      persistData();
      document.documentElement.style.setProperty('--ui-scale', appData.fontScale);
      document.getElementById('scaleIndicator').textContent = `${Math.round(appData.fontScale * 100)}%`;
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {
          showToast('此裝置或瀏覽器限制全螢幕操作', 'warning');
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    /* ========================================================
       資料備份、匯入與清除
       ======================================================== */
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `班級聯絡簿備份_${new Date().toISOString().slice(0, 10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast('備份檔匯出成功！', 'success');
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          appData = Object.assign({}, DEFAULT_DATA, parsed);
          persistData();
          applyDataToDOM();
          closeModal('settingsModal');
          showToast('備份資料已順利還原！', 'success');
        } catch (err) {
          showToast('檔案格式有誤，請選擇合法的 JSON 備份檔。', 'warning');
        }
      };
      reader.readAsText(file);
    }

    function requestClearAll() {
      openConfirmModal(
        '清空該日事項',
        `確定要清空 ${currentDateKey} 當日所有的聯絡簿條目嗎？其他日期的歷史紀錄不會受到影響。`,
        () => {
          appData.dailyHistory[currentDateKey] = [];
          persistData();
          applyDataToDOM();
          closeModal('settingsModal');
          showToast(`已清除 ${currentDateKey} 的所有事項`, 'info');
        }
      );
    }

    /* ========================================================
       Modal 與 Toast 系統元件 (取代危險的 alert/confirm)
       ======================================================== */
    function openModal(id) {
      document.getElementById(id).classList.remove('hidden');
      if (id === 'loginModal') {
        setTimeout(() => document.getElementById('passwordInput').focus(), 50);
      }
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    function openConfirmModal(title, msg, onConfirm) {
      const modal = document.getElementById('confirmModal');
      document.getElementById('confirmTitle').textContent = title;
      document.getElementById('confirmMsg').textContent = msg;
      
      const okBtn = document.getElementById('confirmOkBtn');
      const cancelBtn = document.getElementById('confirmCancelBtn');

      const cleanup = () => {
        modal.classList.add('hidden');
        okBtn.onclick = null;
        cancelBtn.onclick = null;
      };

      okBtn.onclick = () => {
        cleanup();
        if (typeof onConfirm === 'function') onConfirm();
      };

      cancelBtn.onclick = () => {
        cleanup();
      };

      modal.classList.remove('hidden');
    }

    function showToast(message, type = 'info') {
      const box = document.getElementById('toastBox');
      const toast = document.createElement('div');
      
      let bg = 'bg-slate-900 text-white';
      if (type === 'success') bg = 'bg-emerald-600 text-white';
      if (type === 'warning') bg = 'bg-amber-600 text-white';
      if (type === 'info') bg = 'bg-slate-800 text-white';

      toast.className = `${bg} px-4 py-2.5 rounded-xl shadow-lg font-bold text-sm flex items-center gap-2 transform transition duration-300 opacity-0 translate-y-2 pointer-events-auto select-none`;
      toast.innerHTML = `<span>${message}</span>`;
      box.appendChild(toast);

      setTimeout(() => {
        toast.classList.remove('opacity-0', 'translate-y-2');
      }, 10);

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    /* 頁面載入執行 */
    window.onload = function() {
      initData();
    };
  </script>
</body>
</html>
